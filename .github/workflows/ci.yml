name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-type-test:
    runs-on: ubuntu-latest

    # A real PostgreSQL for the database tests, so SQLite-only assumptions get caught.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      POSTGRES_URL: postgresql+psycopg://ci:ci@localhost:5432/ci

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy

      - name: Pytest (SQLite)
        run: pytest

      - name: Pytest database tests (PostgreSQL)
        env:
          TEST_DATABASE_URL: ${{ env.POSTGRES_URL }}
        run: pytest tests/test_repository.py tests/test_migrations.py

      - name: Migrations via the CLI, as Docker runs them (PostgreSQL)
        env:
          DATABASE_URL: ${{ env.POSTGRES_URL }}
        run: |
          alembic upgrade head
          alembic check

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t scam-campaign-linker:ci .
