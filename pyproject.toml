[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scam-campaign-linker"
dynamic = ["version"]
description = "Passive, defensive tool that links scam/phishing sites into campaigns using shared infrastructure."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16",  # database migrations
    "dnspython>=2.6",
    "fastapi>=0.115",
    "httpx>=0.27",
    "mmh3>=4.1",  # favicon hash, same scheme as Shodan's http.favicon.hash
    "psycopg[binary]>=3.1",  # PostgreSQL driver
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "tldextract>=5.3",  # registered domain from a hostname (handles co.uk etc.)
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "respx>=0.21",  # mocks httpx so tests never touch the network
    "ruff>=0.6",
]

[tool.hatch.version]
path = "src/scam_linker/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/scam_linker"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import order, B: bugbear, UP: modern syntax, S: bandit security checks
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.isort]
known-first-party = ["scam_linker", "fakes"]  # fakes = tests/fakes.py, our shared test doubles

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # plain `assert` is how pytest works

[tool.mypy]
python_version = "3.12"
files = ["src", "tests", "migrations", "scripts"]
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    # Starlette 1.x prefers the separate `httpx2` package for its TestClient. We stay on httpx,
    # which respx is built for, rather than add a dependency we haven't vetted. Test-only.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.alembic]
script_location = "%(here)s/migrations"
file_template = "%%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s"  # sorts by date in file lists

# Format generated migrations so they pass the same ruff checks as the rest of the code.
[[tool.alembic.post_write_hooks]]
name = "ruff_format"
type = "module"
module = "ruff"
options = "format REVISION_SCRIPT_FILENAME"

[[tool.alembic.post_write_hooks]]
name = "ruff_fix"
type = "module"
module = "ruff"
options = "check --fix REVISION_SCRIPT_FILENAME"
